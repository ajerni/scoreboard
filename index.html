<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .controls h2 {
            margin-bottom: 20px;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .control-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .control-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .leaderboard {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .leaderboard h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .refresh-indicator {
            font-size: 0.8em;
            color: #999;
            font-weight: normal;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .leaderboard-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9em;
        }

        .leaderboard-table tbody tr {
            border-bottom: 1px solid #e9ecef;
            transition: background-color 0.2s;
        }

        .leaderboard-table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .leaderboard-table tbody tr:last-child {
            border-bottom: none;
        }

        .leaderboard-table td {
            padding: 15px;
        }

        .rank-badge {
            display: inline-block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.1em;
        }

        .rank-1 {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
        }

        .rank-2 {
            background: linear-gradient(135deg, #C0C0C0 0%, #808080 100%);
            color: white;
        }

        .rank-3 {
            background: linear-gradient(135deg, #CD7F32 0%, #8B4513 100%);
            color: white;
        }

        .rank-other {
            background: #e9ecef;
            color: #667eea;
        }

        .player-name {
            font-weight: 600;
            color: #333;
        }

        .score {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
        }

        .timestamp {
            color: #999;
            font-size: 0.9em;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .control-group {
                grid-template-columns: 1fr;
            }

            .leaderboard-table {
                font-size: 0.9em;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Scoreboard</h1>
            <p>Compete for the top spots!</p>
        </div>

        <div class="controls">
            <h2>Controls</h2>
            <div class="control-group">
                <!-- Enter Score -->
                <div class="control-card">
                    <h3>Enter Score</h3>
                    <form id="enterScoreForm">
                        <div class="form-group">
                            <label for="playerName">Player Name</label>
                            <input type="text" id="playerName" required placeholder="Enter your name">
                        </div>
                        <div class="form-group">
                            <label for="playerScore">Score</label>
                            <input type="number" id="playerScore" required placeholder="Enter your score" min="0">
                        </div>
                        <button type="submit" class="btn btn-primary">Submit Score</button>
                        <div id="enterScoreMessage" class="message"></div>
                    </form>
                </div>

                <!-- Show Scores -->
                <div class="control-card">
                    <h3>Refresh Leaderboard</h3>
                    <p style="margin-bottom: 15px; color: #666;">Manually refresh the leaderboard</p>
                    <button type="button" class="btn btn-primary" onclick="loadLeaderboard()">Refresh Now</button>
                    <div id="refreshMessage" class="message"></div>
                </div>

                <!-- Empty Scoreboard -->
                <div class="control-card">
                    <h3>Clear All Scores</h3>
                    <p style="margin-bottom: 15px; color: #666;">⚠️ This will delete all entries!</p>
                    <button type="button" class="btn btn-danger" onclick="emptyScoreboard()">Clear Scoreboard</button>
                    <div id="emptyMessage" class="message"></div>
                </div>
            </div>
        </div>

        <div class="leaderboard">
            <h2>
                <span>Top 10 Leaderboard</span>
                <span class="refresh-indicator" id="lastRefresh"></span>
            </h2>
            <div id="leaderboardContent">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading leaderboard...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' 
            ? 'http://localhost:8083/api' 
            : 'https://statustracker.ernilabs.com/api';
        const API_KEY = 'statustracker-apisecret';

        // Load leaderboard on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadLeaderboard();
            // Auto-refresh every 5 seconds
            setInterval(loadLeaderboard, 5000);
        });

        // Enter Score Form Handler
        document.getElementById('enterScoreForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('playerName').value.trim();
            const score = parseInt(document.getElementById('playerScore').value);
            const messageEl = document.getElementById('enterScoreMessage');

            if (!name || !score) {
                showMessage(messageEl, 'Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/scoreboard/enter_score`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': API_KEY
                    },
                    body: JSON.stringify({ name, score })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                showMessage(messageEl, 
                    `Score submitted! ${data.is_top_10 ? '🎉 You made it to the top 10!' : 'Keep trying!'}`, 
                    'success'
                );
                
                // Clear form
                document.getElementById('enterScoreForm').reset();
                
                // Reload leaderboard after a short delay
                setTimeout(loadLeaderboard, 500);
            } catch (error) {
                showMessage(messageEl, `Error: ${error.message}`, 'error');
            }
        });

        // Load Leaderboard
        async function loadLeaderboard() {
            const contentEl = document.getElementById('leaderboardContent');
            
            try {
                const response = await fetch(`${API_BASE}/scoreboard/show_scores`, {
                    headers: {
                        'x-api-key': API_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const scores = await response.json();
                displayLeaderboard(scores);
                updateRefreshTime();
            } catch (error) {
                contentEl.innerHTML = `
                    <div class="empty-state">
                        <p style="color: #f5576c;">Error loading leaderboard: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Display Leaderboard
        function displayLeaderboard(scores) {
            const contentEl = document.getElementById('leaderboardContent');

            if (!scores || scores.length === 0) {
                contentEl.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                        <h3>No scores yet!</h3>
                        <p>Be the first to submit a score!</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Score</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            scores.forEach((entry, index) => {
                const rankClass = entry.rank === 1 ? 'rank-1' : 
                                 entry.rank === 2 ? 'rank-2' : 
                                 entry.rank === 3 ? 'rank-3' : 'rank-other';
                const date = new Date(entry.created_at).toLocaleString();
                
                html += `
                    <tr>
                        <td>
                            <span class="rank-badge ${rankClass}">${entry.rank}</span>
                        </td>
                        <td class="player-name">${escapeHtml(entry.name)}</td>
                        <td class="score">${entry.score.toLocaleString()}</td>
                        <td class="timestamp">${date}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            contentEl.innerHTML = html;
        }

        // Empty Scoreboard
        async function emptyScoreboard() {
            if (!confirm('Are you sure you want to clear all scores? This action cannot be undone!')) {
                return;
            }

            const messageEl = document.getElementById('emptyMessage');
            
            try {
                const response = await fetch(`${API_BASE}/scoreboard/empty_scoreboard`, {
                    method: 'DELETE',
                    headers: {
                        'x-api-key': API_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                showMessage(messageEl, `Scoreboard cleared! ${data.deleted_count} entries deleted.`, 'success');
                
                // Reload leaderboard
                setTimeout(loadLeaderboard, 500);
            } catch (error) {
                showMessage(messageEl, `Error: ${error.message}`, 'error');
            }
        }

        // Helper Functions
        function showMessage(element, message, type) {
            element.textContent = message;
            element.className = `message ${type}`;
            element.style.display = 'block';
            
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        function updateRefreshTime() {
            const now = new Date();
            document.getElementById('lastRefresh').textContent = 
                `Last updated: ${now.toLocaleTimeString()}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
